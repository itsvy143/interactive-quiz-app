<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Interactive Quiz App</h1>
      <p>Test your knowledge and challenge yourself!</p>
    </header>

    <main>
      <section class="quiz-container">
        <!-- Quiz Header -->
        <div class="quiz-header">
          <p id="question-counter">Question 1 of 10</p>
          <p id="score-display">Score: 0</p>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
          <div id="progress-bar"></div>
        </div>

        <!-- Quiz Content -->
        <div id="quiz-content">
          <h2 id="question">Loading question...</h2>

          <div id="answer-buttons" class="answer-buttons">
            <!-- Answer buttons will be generated by JavaScript -->
          </div>

          <p id="feedback" aria-live="polite"></p>

          <button type="button" id="next-button" disabled>Next Question</button>
        </div>

        <!-- Results -->
        <div id="result-container" hidden>
          <h2>Quiz Completed!</h2>
          <p id="final-score"></p>
          <p id="result-message"></p>
          <button type="button" id="restart-button">Try Again</button>
        </div>
      </section>
    </main>

    <footer>
      <p>Interactive Quiz App | Built with HTML, CSS, and JavaScript</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
